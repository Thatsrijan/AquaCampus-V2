<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Fluid Specular & Rim Glow Filters -->
    <filter id="liquidGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>

    <filter id="highlightBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" />
    </filter>

    <!-- Deep Metallic Fluid Body -->
    <radialGradient id="bodyDeep" cx="44%" cy="62%" r="60%" fx="40%" fy="52%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="28%" stop-color="#0284c7" />
      <stop offset="55%" stop-color="#0369a1" />
      <stop offset="80%" stop-color="#075985" />
      <stop offset="94%" stop-color="#0c2d48" />
      <stop offset="100%" stop-color="#051624" />
    </radialGradient>

    <!-- Lower Belly Fluid Light Refraction -->
    <radialGradient id="internalRefraction" cx="48%" cy="72%" r="42%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#0284c7" stop-opacity="0.45" />
      <stop offset="85%" stop-color="#0369a1" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0" />
    </radialGradient>

    <!-- Primary Silvery Specular Highlight Gradient -->
    <linearGradient id="primarySpecular" x1="28%" y1="18%" x2="42%" y2="82%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#e0f2fe" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <!-- Secondary Soft Core Highlight -->
    <radialGradient id="specularCore" cx="34%" cy="48%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#bae6fd" stop-opacity="0.35" />
      <stop offset="80%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Right Rim Light -->
    <linearGradient id="rightRim" x1="100%" y1="30%" x2="60%" y2="70%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <!-- Outer Ambient Hydro Glow -->
    <radialGradient id="ambientAura" cx="50%" cy="56%" r="50%">
      <stop offset="0%" stop-color="#00daf3" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Outer Cyan Aura -->
  <path d="M 256 136 C 255 144, 228 206, 196 256 C 178 282, 170 295, 170 310 C 170 350, 208 378, 256 378 C 304 378, 342 350, 342 310 C 342 295, 334 282, 316 256 C 284 206, 257 144, 256 136 Z"
        fill="url(#ambientAura)" filter="url(#liquidGlow)" />

  <!-- Base Dark Silhouette for Deep 3D Shadow -->
  <path d="M 256 138 C 255 145, 230 205, 200 255 C 182 280, 175 292, 175 305 C 175 342, 210 370, 256 370 C 302 370, 337 342, 337 305 C 337 292, 330 280, 312 255 C 282 205, 257 145, 256 138 Z"
        fill="#04121d" />

  <!-- Main 3D Metallic-Liquid Droplet Body -->
  <path d="M 256 138 C 255 145, 230 205, 200 255 C 182 280, 175 292, 175 305 C 175 342, 210 370, 256 370 C 302 370, 337 342, 337 305 C 337 292, 330 280, 312 255 C 282 205, 257 145, 256 138 Z"
        fill="url(#bodyDeep)" />

  <!-- Internal Belly Refraction Glow (Light Gathering in Water Drop) -->
  <ellipse cx="254" cy="326" rx="58" ry="34"
           fill="url(#internalRefraction)" />

  <!-- Right Rim Backlight -->
  <path d="M 256 138 C 255 145, 230 205, 200 255 C 182 280, 175 292, 175 305 C 175 342, 210 370, 256 370 C 302 370, 337 342, 337 305 C 337 292, 330 280, 312 255 C 282 205, 257 145, 256 138 Z"
        fill="url(#rightRim)" />

  <!-- Primary Organic Specular Sheen (Curved Left Edge Highlight) -->
  <path d="M 256 142 C 255 148, 234 200, 207 248 C 193 274, 185 290, 186 308 C 187 325, 196 342, 212 352 C 198 340, 191 324, 191 306 C 191 292, 198 276, 212 250 C 238 204, 255 152, 256 142 Z"
        fill="url(#primarySpecular)" filter="url(#highlightBlur)" />

  <!-- Mid-Body Soft Specular Bloom (Glossy Highlight Core) -->
  <ellipse cx="218" cy="275" rx="18" ry="30" transform="rotate(-22 218 275)"
           fill="url(#specularCore)" filter="url(#softBlur)" />

  <!-- Crisp Apex Droplet Glint -->
  <ellipse cx="255.5" cy="144" rx="2.5" ry="6" transform="rotate(-12 255.5 144)"
           fill="#ffffff" opacity="0.9" />

  <!-- Bottom Crest Caustic Rim -->
  <path d="M 204 350 C 220 362, 240 366, 260 366 C 280 366, 300 360, 314 348 C 298 358, 278 363, 260 363 C 240 363, 222 358, 204 350 Z"
        fill="#38bdf8" opacity="0.4" filter="url(#softBlur)" />
</svg>
